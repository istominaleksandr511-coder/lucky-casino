
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>LuckyShot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
    --bg: #000000;
    --panel: #101522;
    --panel2: #171F32;
    --blue: #559BFF;
    --purple: #8568FF;
    --text: #F5F7FF;
    --muted: #8491AC;
    --border: rgba(135,160,210,.13);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #000;
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding-bottom: calc(42px + env(safe-area-inset-bottom));
}

button, select {
    font: inherit;
    border: none;
    cursor: pointer;
    color: inherit;
}

/* HEADER */

.header {
    min-height: 65px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 7px;
    border-bottom: 1px solid var(--border);
    background: #000;
    position: sticky;
    top: 0;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}

.logo {
    width: 31px;
    height: 31px;
    flex-shrink: 0;
}

.brand-name {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -1px;
    white-space: nowrap;
}

.brand-name span {
    color: var(--blue);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

/* WALLET */

.wallet {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #101522;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 5px 6px 5px 8px;
}

.wallet-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 43px;
}

.currency-select {
    width: 53px;
    background: transparent;
    color: #8CB9FF;
    font-size: 10px;
    font-weight: 850;
    outline: none;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
}

.currency-select option {
    background: #111827;
    color: white;
}

.wallet-value {
    font-size: 12px;
    font-weight: 850;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

.add-button {
    background: linear-gradient(135deg, #478FFF, #745AFF);
    border-radius: 6px;
    padding: 7px 7px;
    font-size: 9px;
    font-weight: 800;
    white-space: nowrap;
}

.profile-button {
    width: 31px;
    height: 31px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #151B2A;
    border: 1px solid var(--border);
    flex-shrink: 0;
}

.profile-button svg {
    width: 17px;
    height: 17px;
}

/* MAIN */

.main {
    max-width: 650px;
    margin: 0 auto;
    padding: 20px 15px;
}

.welcome {
    margin-bottom: 23px;
}

.welcome-label {
    font-size: 10px;
    color: var(--blue);
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 9px;
}

.welcome h1 {
    font-size: 24px;
    line-height: 1.2;
    font-weight: 850;
    letter-spacing: -.7px;
}

.welcome p {
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    margin-top: 8px;
}

/* FEATURE */

.feature {
    position: relative;
    overflow: hidden;
    min-height: 195px;
    border-radius: 17px;
    padding: 19px;
    background:
        radial-gradient(ellipse at 90% 40%, rgba(111,83,255,.25), transparent 55%),
        linear-gradient(120deg, #152849, #11172D 65%, #201642);
    border: 1px solid rgba(110,145,255,.2);
    margin-bottom: 25px;
}

.feature::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -75px;
    top: 10px;
    border-radius: 50%;
    background: rgba(95,110,255,.10);
    filter: blur(20px);
}

.feature-content {
    position: relative;
    z-index: 2;
}

.feature-tag {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 6px;
    background: rgba(80,145,255,.15);
    color: #8CB9FF;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1px;
}

.feature h2 {
    font-size: 24px;
    font-weight: 900;
    margin-top: 15px;
}

.feature p {
    color: #A6B5D1;
    font-size: 11px;
    margin-top: 7px;
}

.feature-button {
    margin-top: 17px;
    background: linear-gradient(110deg, #478FFF, #785BFF);
    padding: 10px 16px;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 800;
}

/* SECTION */

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.section-title h3 {
    font-size: 15px;
    font-weight: 800;
}

.section-title span {
    font-size: 10px;
    color: var(--muted);
}

/* GAME CARDS */

.game-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
}

.game-card {
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
}

.game-art {
    height: 105px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, rgba(93,117,255,.22), transparent 65%),
        #111827;
}

.game-art svg {
    width: 51px;
    height: 51px;
    color: #86A9FF;
}

.game-info {
    padding: 10px;
}

.game-info h4 {
    font-size: 12px;
    font-weight: 800;
}

.game-info p {
    color: var(--muted);
    font-size: 10px;
    margin-top: 5px;
}

/* EXCHANGE RATE CREDIT */

.rate-credit {
    margin-top: 18px;
    text-align: center;
    font-size: 9px;
    color: #59647A;
}

.rate-credit a {
    color: #829AC3;
    text-decoration: none;
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(39px + env(safe-area-inset-bottom));
    padding: 2px 18px env(safe-area-inset-bottom);
    background: rgba(8,11,19,.98);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    z-index: 20;
}

.nav-item {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1px;
    background: transparent;
    color: #77849E;
    font-size: 8px;
    font-weight: 650;
}

.nav-item svg {
    width: 15px;
    height: 15px;
}

.nav-item.active {
    color: #83AFFF;
}

.nav-item.center svg {
    width: 17px;
    height: 17px;
}

button:active {
    transform: scale(.97);
}

/* SMALL SCREENS */

@media (max-width: 360px) {
    .header {
        padding: 0 8px;
        gap: 4px;
    }

    .brand-name {
        font-size: 17px;
    }

    .logo {
        width: 27px;
        height: 27px;
    }

    .header-right {
        gap: 5px;
    }

    .wallet {
        padding: 4px 5px;
        gap: 4px;
    }

    .currency-select {
        width: 45px;
    }

    .wallet-value {
        font-size: 11px;
    }

    .add-button {
        font-size: 8px;
        padding: 6px 5px;
    }

    .profile-button {
        width: 29px;
        height: 29px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <svg class="logo" viewBox="0 0 100 100" fill="none">
            <defs>
                <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
                    <stop stop-color="#72B5FF"/>
                    <stop offset="1" stop-color="#795CFF"/>
                </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="43" stroke="url(#metal)" stroke-width="7"/>
            <circle cx="50" cy="50" r="31" fill="#101827" stroke="#80A9FF" stroke-width="3"/>
            <g fill="#000000" stroke="#83AFFF" stroke-width="2">
                <circle cx="50" cy="31" r="8"/>
                <circle cx="66" cy="41" r="8"/>
                <circle cx="60" cy="60" r="8"/>
                <circle cx="40" cy="60" r="8"/>
                <circle cx="34" cy="41" r="8"/>
            </g>
            <circle cx="50" cy="50" r="7" fill="url(#metal)"/>
        </svg>

        <div class="brand-name">Lucky<span>Shot</span></div>
    </div>

    <div class="header-right">

        <div class="wallet">
            <div class="wallet-info">
                <select class="currency-select" id="currency" aria-label="Выбрать валюту">
                    <option value="RUB">RUB ▾</option>
                    <option value="USD">USD ▾</option>
                    <option value="EUR">EUR ▾</option>
                    <option value="GBP">GBP ▾</option>
                    <option value="AED">AED ▾</option>
                    <option value="TRY">TRY ▾</option>
                    <option value="KZT">KZT ▾</option>
                    <option value="CNY">CNY ▾</option>
                </select>
                <span class="wallet-value" id="walletValue">1 000</span>
            </div>

            <button class="add-button" onclick="showMessage('Пополнение скоро появится')">
                + Пополнить
            </button>
        </div>

        <button class="profile-button" onclick="showMessage('Профиль скоро появится')" aria-label="Профиль">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/>
            </svg>
        </button>

    </div>
</header>

<main class="main">

    <section class="welcome">
        <div class="welcome-label">LUCKYSHOT GAMING</div>
        <h1>Добро пожаловать!</h1>
        <p>Твоё игровое пространство начинается здесь.</p>
    </section>

    <section class="feature">
        <div class="feature-content">
            <span class="feature-tag">НОВИНКА</span>
            <h2>LUCKY SHOT</h2>
            <p>Испытай удачу в нашей главной игре.</p>
            <button class="feature-button"
                    onclick="showMessage('Lucky Shot скоро появится')">
                Скоро открытие →
            </button>
        </div>
    </section>

    <section>
        <div class="section-title">
            <h3>Популярные игры</h3>
            <span>Скоро больше</span>
        </div>

        <div class="game-grid">

            <article class="game-card">
                <div class="game-art">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>
                    </svg>
                </div>
                <div class="game-info">
                    <h4>Lucky Slots</h4>
                    <p>Игровые автоматы</p>
                </div>
            </article>

            <article class="game-card">
                <div class="game-art">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="4" y="4" width="16" height="16" rx="4"/>
                        <circle cx="9" cy="9" r="1.2" fill="currentColor"/>
                        <circle cx="15" cy="15" r="1.2" fill="currentColor"/>
                        <circle cx="15" cy="9" r="1.2" fill="currentColor"/>
                        <circle cx="9" cy="15" r="1.2" fill="currentColor"/>
                    </svg>
                </div>
                <div class="game-info">
                    <h4>Dice Arena</h4>
                    <p>Игры с кубиками</p>
                </div>
            </article>

        </div>
    </section>

    <div class="rate-credit">
        Курсы валют предоставлены
        <a href="https://www.exchangerate-api.com/" target="_blank" rel="noopener">
            ExchangeRate-API
        </a>
    </div>

</main>

<nav class="bottom-nav">

    <button class="nav-item active" onclick="setTab(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>
        </svg>
        <span>Лобби</span>
    </button>

    <button class="nav-item center" onclick="setTab(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 3v6m9 3h-6M12 21v-6M3 12h6"/>
        </svg>
        <span>Lucky Shot</span>
    </button>

    <button class="nav-item" onclick="setTab(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <span>Меню</span>
    </button>

</nav>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

// Пока используем демонстрационный баланс.
// В дальнейшем получим его из защищённого сервера.
const baseBalanceRUB = 1000;

const currencySelect = document.getElementById("currency");
const walletValue = document.getElementById("walletValue");

let exchangeRates = null;
let ratesDate = null;

const formatter = new Intl.NumberFormat("ru-RU", {
    maximumFractionDigits: 2
});

function showMessage(message) {
    if (tg) {
        tg.showAlert(message);
    } else {
        alert(message);
    }
}

function setTab(button) {
    document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.remove("active");
    });

    button.classList.add("active");

    const tab = button.innerText.trim();

    if (tab !== "Лобби") {
        showMessage(tab + " — этот раздел пока в разработке");
    }
}

function updateBalance() {
    const currency = currencySelect.value;

    if (currency === "RUB") {
        walletValue.textContent = formatter.format(baseBalanceRUB);
        return;
    }

    if (!exchangeRates || !exchangeRates[currency]) {
        walletValue.textContent = "Нет курса";
        return;
    }

    const converted = baseBalanceRUB * exchangeRates[currency];

    walletValue.textContent = formatter.format(converted);
}

async function loadExchangeRates() {
    try {
        const response = await fetch(
            "https://open.er-api.com/v6/latest/RUB"
        );

        if (!response.ok) {
            throw new Error("Не удалось получить курсы валют");
        }

        const data = await response.json();

        if (data.result !== "success" || !data.rates) {
            throw new Error("Некорректный ответ сервиса");
        }

        exchangeRates = data.rates;
        ratesDate = data.time_last_update_utc || null;

        updateBalance();

    } catch (error) {
        console.error("Ошибка курсов валют:", error);
        walletValue.textContent =
            currencySelect.value === "RUB"
                ? formatter.format(baseBalanceRUB)
                : "Нет курса";
    }
}

currencySelect.addEventListener("change", updateBalance);

loadExchangeRates();
</script>

</body>
</html>
