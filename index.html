
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090D19">
<title>LuckyShot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
    --bg: #090D19;
    --panel: #111A2D;
    --panel2: #17233B;
    --blue: #559BFF;
    --purple: #8568FF;
    --text: #F5F7FF;
    --muted: #8491AC;
    --border: rgba(135,160,210,.13);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    min-height: 100vh;
    padding-bottom: 100px;
}

button {
    font: inherit;
    border: none;
    cursor: pointer;
    color: inherit;
}

/* HEADER */

.header {
    height: 76px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: rgba(9,13,25,.96);
    position: sticky;
    top: 0;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
}

.logo {
    width: 35px;
    height: 35px;
    flex-shrink: 0;
}

.brand-name {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -1px;
    white-space: nowrap;
}

.brand-name span {
    color: var(--blue);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 9px;
}

.wallet {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 7px 8px 7px 10px;
}

.wallet-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.wallet-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .7px;
}

.wallet-value {
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
}

.add-button {
    background: linear-gradient(135deg, #478FFF, #745AFF);
    border-radius: 8px;
    padding: 8px 9px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}

.profile-button {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel2);
    border: 1px solid var(--border);
    flex-shrink: 0;
}

.profile-button svg {
    width: 19px;
    height: 19px;
}

/* MAIN */

.main {
    max-width: 650px;
    margin: 0 auto;
    padding: 20px 16px;
}

.welcome {
    margin-bottom: 23px;
}

.welcome-label {
    font-size: 11px;
    color: var(--blue);
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 9px;
}

.welcome h1 {
    font-size: 25px;
    line-height: 1.2;
    font-weight: 850;
    letter-spacing: -.7px;
}

.welcome p {
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    margin-top: 9px;
}

/* FEATURE */

.feature {
    position: relative;
    overflow: hidden;
    min-height: 205px;
    border-radius: 20px;
    padding: 20px;
    background:
        radial-gradient(ellipse at 90% 40%,
        rgba(111,83,255,.30), transparent 55%),
        linear-gradient(120deg, #152849, #11172D 65%, #201642);
    border: 1px solid rgba(110,145,255,.2);
    margin-bottom: 25px;
}

.feature::after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    right: -75px;
    top: 10px;
    border-radius: 50%;
    background: rgba(95,110,255,.10);
    filter: blur(20px);
}

.feature-content {
    position: relative;
    z-index: 2;
}

.feature-tag {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 6px;
    background: rgba(80,145,255,.15);
    color: #8CB9FF;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
}

.feature h2 {
    font-size: 25px;
    font-weight: 900;
    margin-top: 16px;
    letter-spacing: -.5px;
}

.feature p {
    color: #A6B5D1;
    font-size: 12px;
    margin-top: 7px;
}

.feature-button {
    margin-top: 19px;
    background: linear-gradient(110deg, #478FFF, #785BFF);
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
}

/* SECTION */

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 13px;
}

.section-title h3 {
    font-size: 16px;
    font-weight: 800;
}

.section-title span {
    font-size: 11px;
    color: var(--muted);
}

/* GAME CARDS */

.game-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.game-card {
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    overflow: hidden;
}

.game-art {
    height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center,
        rgba(93,117,255,.22), transparent 65%),
        #17223A;
}

.game-art svg {
    width: 55px;
    height: 55px;
    color: #86A9FF;
}

.game-info {
    padding: 11px;
}

.game-info h4 {
    font-size: 13px;
    font-weight: 800;
}

.game-info p {
    color: var(--muted);
    font-size: 10px;
    margin-top: 5px;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 76px;
    padding: 8px 18px calc(8px + env(safe-area-inset-bottom));
    background: rgba(13,19,33,.97);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    z-index: 20;
    backdrop-filter: blur(18px);
}

.nav-item {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    background: transparent;
    color: #77849E;
    font-size: 10px;
    font-weight: 650;
}

.nav-item svg {
    width: 21px;
    height: 21px;
}

.nav-item.active {
    color: #83AFFF;
}

.nav-item.active svg {
    filter: drop-shadow(0 0 7px rgba(80,145,255,.5));
}

.nav-item.center svg {
    width: 25px;
    height: 25px;
}

button:active {
    transform: scale(.97);
}

/* SMALL SCREENS */

@media (max-width: 360px) {
    .header {
        padding: 0 10px;
        gap: 5px;
    }

    .brand-name {
        font-size: 17px;
    }

    .logo {
        width: 30px;
        height: 30px;
    }

    .header-right {
        gap: 6px;
    }

    .wallet {
        padding: 6px;
        gap: 5px;
    }

    .wallet-value {
        font-size: 12px;
    }

    .add-button {
        font-size: 10px;
        padding: 7px;
    }

    .profile-button {
        width: 32px;
        height: 32px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <!-- Фирменный барабан LuckyShot -->
        <svg class="logo" viewBox="0 0 100 100" fill="none">
            <defs>
                <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
                    <stop stop-color="#72B5FF"/>
                    <stop offset="1" stop-color="#795CFF"/>
                </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="43" stroke="url(#metal)" stroke-width="7"/>
            <circle cx="50" cy="50" r="31" fill="#192943" stroke="#80A9FF" stroke-width="3"/>
            <g fill="#0A1020" stroke="#83AFFF" stroke-width="2">
                <circle cx="50" cy="31" r="8"/>
                <circle cx="66" cy="41" r="8"/>
                <circle cx="60" cy="60" r="8"/>
                <circle cx="40" cy="60" r="8"/>
                <circle cx="34" cy="41" r="8"/>
            </g>
            <circle cx="50" cy="50" r="7" fill="url(#metal)"/>
        </svg>

        <div class="brand-name">Lucky<span>Shot</span></div>
    </div>

    <div class="header-right">

        <div class="wallet">
            <div class="wallet-info">
                <span class="wallet-label">БАЛАНС</span>
                <span class="wallet-value">1 000 🪙</span>
            </div>
            <button class="add-button" onclick="showMessage('Пополнение скоро появится')">
                + Пополнить
            </button>
        </div>

        <button class="profile-button" onclick="showMessage('Профиль скоро появится')" aria-label="Профиль">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/>
            </svg>
        </button>

    </div>
</header>

<main class="main">

    <section class="welcome">
        <div class="welcome-label">LUCKYSHOT GAMING</div>
        <h1>Добро пожаловать!</h1>
        <p>Твоё игровое пространство начинается здесь.</p>
    </section>

    <section class="feature">
        <div class="feature-content">
            <span class="feature-tag">НОВИНКА</span>
            <h2>LUCKY SHOT</h2>
            <p>Испытай удачу в нашей главной игре.</p>
            <button class="feature-button"
                    onclick="showMessage('Lucky Shot скоро появится')">
                Скоро открытие →
            </button>
        </div>
    </section>

    <section>
        <div class="section-title">
            <h3>Популярные игры</h3>
            <span>Скоро больше</span>
        </div>

        <div class="game-grid">

            <article class="game-card">
                <div class="game-art">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.3">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>
                    </svg>
                </div>
                <div class="game-info">
                    <h4>Lucky Slots</h4>
                    <p>Игровые автоматы</p>
                </div>
            </article>

            <article class="game-card">
                <div class="game-art">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.5">
                        <rect x="4" y="4" width="16" height="16" rx="4"/>
                        <circle cx="9" cy="9" r="1.2" fill="currentColor"/>
                        <circle cx="15" cy="15" r="1.2" fill="currentColor"/>
                        <circle cx="15" cy="9" r="1.2" fill="currentColor"/>
                        <circle cx="9" cy="15" r="1.2" fill="currentColor"/>
                    </svg>
                </div>
                <div class="game-info">
                    <h4>Dice Arena</h4>
                    <p>Игры с кубиками</p>
                </div>
            </article>

        </div>
    </section>

</main>

<nav class="bottom-nav">

    <button class="nav-item active" onclick="setTab(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>
        </svg>
        <span>Лобби</span>
    </button>

    <button class="nav-item center" onclick="setTab(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 3v6m9 3h-6M12 21v-6M3 12h6"/>
        </svg>
        <span>Lucky Shot</span>
    </button>

    <button class="nav-item" onclick="setTab(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <span>Меню</span>
    </button>

</nav>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

function showMessage(message) {
    if (tg) {
        tg.showAlert(message);
    } else {
        alert(message);
    }
}

function setTab(button) {
    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
    });

    button.classList.add('active');

    const tab = button.innerText.trim();

    if (tab !== 'Лобби') {
        showMessage(tab + ' — этот раздел пока в разработке');
    }
}
</script>

</body>
</html>
